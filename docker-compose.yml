
services:
  upscholar:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: upscholar-api
    ports:
      - "8000:8000"
    volumes:
      # Mount code for development
      - ./backend:/app/backend
      - ./frontend:/app/frontend
      # Mount data directory
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend service using Nginx
  frontend:
    image: nginx:alpine
    container_name: upscholar-frontend
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - upscholar
    restart: unless-stopped

volumes:
  data:
    driver: local